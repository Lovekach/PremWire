[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premwire-automation"
version = "0.1.0"
description = "Local editorial automation for PremWire Football"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.55,<2",
  "pydantic>=2.12,<3",
  "truststore>=0.10.4,<0.11",
  "defusedxml>=0.7.1,<0.8",
]

[project.scripts]
premwire = "premwire.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
